[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "HomeAssistant-API"
version = "6.0.0"
description = "Python Wrapper for Homeassistant's REST API"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<4.0"
authors = [
    { name = "GrandMoff100", email = "minecraftcrusher100@gmail.com" },
]
dependencies = [
    "niquests[ws]>=3",
    "pydantic>=2,<3",
    "simplejson>=3,<4",
]

[project.urls]
Documentation = "https://homeassistantapi.readthedocs.io"
Homepage = "https://github.com/GrandMoff100/HomeAssistantAPI"
Repository = "https://github.com/GrandMoff100/HomeAssistantAPI"

[dependency-groups]
docs = [
    "sphinx-autodoc-typehints>=3,<4",
    "sphinx-rtd-theme>=3,<4",
    "autodoc-pydantic>=2,<3",
]
dev = [
    "types-docutils>=0.22",
    "types-simplejson>=3.20",
    "types-toml>=0.10",
    "zuban>=0.7",
    "ruff>=0.15",
    "pytest-asyncio>=1",
    "pytest-cov>=7",
    "pytest>=8",
    "aiosqlite>=0.22",
    "prek>=0.3.8",
    "pre-commit>=4.5.1",
    "pytest-niquests-cassettes",
]

[tool.uv.workspace]
members = ["packages/pytest-niquests-cassettes"]

[tool.uv.sources]
pytest-niquests-cassettes = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
log_cli = true
# log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__\\(self\\) -> str:",
    "raise RequestTimeoutError\\(",
    "pass",
    "msg = r?f?\".+\"",
    "raise \\w+Error\\(msg\\)",
    "if not isinstance\\(",
    "except RequestsConnectionError:  # noqa: PERF203",
]


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
exclude = [
    '.git',
    '__pycache__',
    '.github',
]
select = ['ALL']
ignore = [
    'E501',
    "D",
    "G004",
    "ANN401",
    "FBT",
    "TD",
    "FIX",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ['F401']
"conf.py" = ['E402']
"docs/*" = ['ALL']
"examples/*" = ['INP001']
"tests/*" = [
    "S101",
    "ANN202",
    "SLF001",
    "PLR2004",
    "INP001",
]
"packages/*" = ["SLF001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.zuban]
exclude = ["^docs/"]
untyped_function_return_mode = "inferred"

[tool.hatch.build.targets.wheel]
packages = ["homeassistant_api"]

[tool.hatch.build.targets.sdist]
include = ["homeassistant_api", "homeassistant_api/py.typed"]
