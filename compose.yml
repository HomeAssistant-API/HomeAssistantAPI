services:
  server:
    image: "homeassistant/home-assistant:stable"
    ports:
      - "8123:8123"
    volumes:
      - ./volumes/config:/config
  tests:
    build:
      context: .
      args:
        BUILD_FROM: "python:3.13"
    image: homeassistant-tests:latest
    volumes:
      - ./volumes/coverage:/app/coverage:rw
    depends_on:
      - server
    environment:
      HOMEASSISTANTAPI_URL: http://server:8123/api
      HOMEASSISTANTAPI_WS_URL: ws://server:8123/api/websocket
      HOMEASSISTANTAPI_TOKEN: ${HOMEASSISTANTAPI_TOKEN}
      DELAY: 10

networks:
  default:
    name: homeassistantapi_default