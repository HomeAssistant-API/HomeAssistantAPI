[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "pytest-niquests-cassettes"
version = "0.1.0"
description = "Record and replay niquests HTTP and WebSocket interactions in pytest"
requires-python = ">=3.11"
dependencies = [
    "niquests>=3",
    "pytest>=8",
    "PyYAML>=6",
]

[project.entry-points.pytest11]
niquests-cassettes = "pytest_niquests_cassettes.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_niquests_cassettes"]
